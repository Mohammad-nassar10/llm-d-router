apiVersion: inference.networking.x-k8s.io/v1alpha1
kind: EndpointPickerConfig
plugins:
  - type: openai-parser
  - type: mock-metrics-source
  - type: queue-scorer
  - type: kv-cache-utilization-scorer
  # Deliberately absent from schedulingProfiles below: request-control plugins are
  # wired by interface assertion, so listing the plugin is the whole opt-in.
  - type: metrics-to-headers
schedulingProfiles:
  - name: default
    plugins:
      - pluginRef: queue-scorer
      - pluginRef: kv-cache-utilization-scorer
requestHandler:
  parsers:
  - pluginRef: openai-parser
dataLayer:
  sources:
  - pluginRef: mock-metrics-source
